fof-oauth:
    admin:
        settings:
            providers:
                mediawiki:
                    description: Configure your MediaWiki OAuth2 application. 
                        See the documentation at {link}

                    base_url_label: MediaWiki Base URL
                    client_id_label: Client Key
                    client_secret_label: => fof-oauth.ref.settings.client_secret
                    user_agent_label: User Agent
                    icon_label: Provider Icon (FontAwesome class)
                    show_wiki_status: Show wiki status on user profiles

    forum:
        log_in:
            with_mediawiki_button: '=> fof-oauth.forum.log_in.with_button'

        error:
            wiki_user_blocked: Your MediaWiki account has been blocked and you 
                cannot log in to this forum.
            invalid_email: Unable to retrieve an email address from your MediaWiki
                account. Please use another login method.

        providers:
            mediawiki: '=> fof-oauth.lib.providers.mediawiki'

    lib:
        providers:
            mediawiki: MediaWiki

songnguxyz-oauth-mediawiki:
    admin:
        settings:
            show_wiki_status: Display wiki account status on user profiles
    forum:
        linked_accounts:
            username_label: In-wiki username
        profile:
            status:
                label: 'MediaWiki status ({username})'
                active: Account is active
                blocked: Account is blocked
                blocked_until: 'Blocked until: {time}'
                block_reason: 'Reason: {reason}'
                unknown_username: unknown
